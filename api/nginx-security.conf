# Include these locations inside the HTTPS server block that serves cn.weblab.tec4.ar.
# Keep the more specific deny rules before any general /api/ PHP routing rule.
location ~* ^/api/(?:\.env(?:\..*)?|src/|routes/|tests/|migrations/|run\.php|README\.md|openapi\.json)(?:$|/) {
    return 404;
}

# Deny common dotfiles and repository metadata if the project directory is under the document root.
location ~ (^|/)\.(?:env(?:\..*)?|git|svn|htaccess|htpasswd)(?:/|$) {
    return 404;
}
